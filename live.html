<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pral — Live Match Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #F4F4F1; --surface: #FFFFFF; --ink: #111318; --muted: #5B5F6B; --line: #D9DAD5; --edge: #111318;
      --pitch: #111318; --onpitch: #FFFFFF; --card: #FF5A4E; --oncard: #111318; --red: #E0312B; --onred: #FFFFFF; --soft: #EFEFEA;
      --head: #111318; --headink: #FFFFFF; --tab: #24272F; --tabink: #FFFFFF; --tabedge: #3A3E48; --tabon: #FF5A4E; --tabonink: #111318;
      --wallet: #FF5A4E; --walletink: #111318; --scorebg: #111318; --fill: #FF5A4E; --fillink: #111318; --filledge: #111318;
      --hbg: #111318; --hink: #FFFFFF; --t1: #111318; --t2: #E0312B;
      --disp: "Archivo Black", "Archivo", system-ui, sans-serif;
      --body: "Archivo", system-ui, -apple-system, Segoe UI, sans-serif;
      --navh: 66px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1014; --surface: #191B21; --ink: #F3F3EF; --muted: #A3A6B0; --line: #2B2E37; --edge: #8E929C;
        --pitch: #FF6A5E; --onpitch: #111318; --card: #FF6A5E; --oncard: #111318; --red: #FF5A54; --onred: #111318; --soft: #22252D;
        --head: #15171C; --headink: #FFFFFF; --tab: #22252D; --tabink: #F3F3EF; --tabedge: #3A3E48; --tabon: #FF6A5E; --tabonink: #111318;
        --wallet: #FF6A5E; --walletink: #111318; --scorebg: #0B0C0F; --fill: #FF6A5E; --fillink: #111318; --filledge: #FF6A5E;
        --hbg: #22252D; --hink: #F3F3EF; --t1: #F3F3EF; --t2: #FF6A5E;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg);
      background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
      background-size: 18px 18px; color: var(--ink);
      font: 500 16px/1.45 var(--body); -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .num { font-family: "Archivo", system-ui, sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; }

    header { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--headink); border-bottom: 3px solid var(--edge); }
    .bar { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font: 400 32px/.95 var(--disp); letter-spacing: -.02em; text-decoration: none; color: inherit; }
    .brand .dot { display: inline-block; width: .26em; height: .26em; border-radius: 50%; background: var(--card); margin-left: .07em; }
    .brand small { display: block; font: 700 12px/1.3 var(--body); opacity: .75; margin-top: 3px; }
    .walletwrap { display: flex; gap: 8px; align-items: center; }
    .wallet {
      display: flex; align-items: baseline; gap: 4px;
      background: var(--wallet); color: var(--walletink);
      border-radius: 8px; padding: 6px 11px; transform: rotate(-2deg);
      box-shadow: 3px 3px 0 var(--edge); text-decoration: none;
    }
    .wallet .num { font-size: 20px; line-height: 1; }
    .minside-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--tab); color: var(--tabink);
      border: 2px solid var(--tabedge); border-radius: 8px;
      padding: 6px 10px; font: 800 12.5px/1 var(--body);
      text-decoration: none; box-shadow: 2px 2px 0 var(--edge);
    }

    main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--navh) + 32px); }

    /* Live Card & Big Event Display Banner */
    .livecard {
      background: var(--surface); border: 3px solid var(--edge);
      border-radius: 16px; padding: 16px; box-shadow: 6px 6px 0 var(--edge);
      position: relative; overflow: hidden;
    }
    .lvtop { display: flex; justify-content: space-between; align-items: center; }
    .blive { font-size: 12px; font-weight: 800; border-radius: 6px; padding: 4px 10px; background: var(--soft); color: var(--muted); border: 2px solid var(--edge); }
    .blive.on { background: var(--red); color: var(--onred); }
    .blive.on::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1.2s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .clock { font-size: 26px; }

    /* STORT LIVE DISPLAY (MÅL!, KAMPSTART, SLUTFLØJT) */
    .event-mega {
      background: var(--card); color: var(--oncard);
      border: 3px solid var(--edge); border-radius: 12px;
      padding: 12px 14px; margin: 12px 0;
      text-align: center; box-shadow: 4px 4px 0 var(--edge);
      animation: popIn .25s ease-out;
    }
    @keyframes popIn { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .event-mega .ev-title { font: 400 28px/1 var(--disp); display: block; text-transform: uppercase; }
    .event-mega .ev-sub { font-weight: 800; font-size: 14px; margin-top: 4px; display: block; }

    .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 12px 0 14px; text-align: center; font: 400 18px/1.2 var(--disp); }
    .score b { font: 900 42px/1 "Archivo", system-ui, sans-serif; background: var(--scorebg); color: var(--card); border: 2.5px solid var(--edge); padding: 6px 14px; border-radius: 10px; }

    .lockbar { background: var(--fill); color: var(--fillink); border: 2px solid var(--filledge); border-radius: 8px; padding: 8px 10px; font-weight: 800; font-size: 13.5px; margin-bottom: 10px; text-align: center; }

    .market-label { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 6px; display: flex; justify-content: space-between; }
    .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .odd {
      background: var(--soft); border: 2px solid var(--edge); border-radius: 10px;
      padding: 8px 6px 6px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; line-height: 1.05; box-shadow: 3px 3px 0 var(--edge);
    }
    .odd .ol { font-size: 11.5px; font-weight: 800; color: var(--muted); text-align: center; }
    .odd .ov { font: 900 24px/1.1 "Archivo", system-ui, sans-serif; margin-top: 2px; }
    .odd .cs { font-size: 10.5px; font-weight: 700; color: var(--muted); margin-top: 3px; }
    .odd.on { background: var(--pitch); color: var(--onpitch); transform: translate(3px, 3px); box-shadow: none; }
    .odd.on .ol, .odd.on .cs { color: var(--onpitch); opacity: .85; }
    .odd:disabled { opacity: .45; cursor: default; box-shadow: none; }

    /* INLINE LIVE-KUPON DIREKTE UNDER KAMPEN (Ingen overnavigation!) */
    .inline-slip {
      margin-top: 14px; padding-top: 14px; border-top: 2.5px dashed var(--line);
    }
    .inline-slip-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .stakes { display: flex; gap: 8px; margin-bottom: 10px; }
    .stakes button { flex: 1; border: 2px solid var(--edge); background: var(--surface); border-radius: 8px; padding: 6px 0; cursor: pointer; font-weight: 800; box-shadow: 2px 2px 0 var(--edge); font-size: 13px; }
    .stakes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; transform: translate(2px, 2px); }
    .cta { width: 100%; border: 3px solid var(--edge); border-radius: 12px; padding: 11px; background: var(--pitch); color: var(--onpitch); font: 400 17px/1.1 var(--disp); cursor: pointer; box-shadow: 4px 4px 0 var(--edge); }
    .cta:disabled { background: var(--soft); color: var(--muted); box-shadow: none; cursor: default; }

    .speed-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; font-weight: 800; color: var(--muted); }
    .speed-bar button { border: 1.5px solid var(--edge); background: var(--surface); border-radius: 6px; padding: 3px 9px; font-weight: 800; cursor: pointer; margin-left: 4px; }
    .speed-bar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

    h3 {
      font: 400 20px/1.1 var(--disp); margin: 24px 0 10px;
      display: inline-block; background: var(--hbg); color: var(--hink);
      border: 1.5px solid var(--edge); padding: 4px 10px; border-radius: 6px;
      transform: rotate(-1deg);
    }

    /* FLASHSCORE-STILISTISK TIDSLINJE */
    .fs-timeline {
      background: var(--surface); border: 2px solid var(--edge); border-radius: 14px;
      overflow: hidden;
    }
    .fs-row {
      display: grid; grid-template-columns: 48px 34px 1fr auto;
      align-items: center; gap: 8px; padding: 10px 12px;
      border-top: 1px solid var(--line); font-size: 14px; font-weight: 700;
    }
    .fs-row:first-child { border-top: 0; }
    .fs-min {
      background: var(--ink); color: var(--surface); border-radius: 6px;
      padding: 3px 6px; text-align: center; font: 900 13px/1 "Archivo", sans-serif;
    }
    .fs-icon { font-size: 18px; text-align: center; }
    .fs-badge {
      font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px;
      background: var(--soft); border: 1px solid var(--edge);
    }

    /* Dine aktive live-kald i kampen */
    .my-live-card {
      background: var(--surface); border: 1.5px solid var(--edge); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .chip { font-size: 12px; font-weight: 800; border-radius: 6px; padding: 3px 8px; background: var(--soft); border: 1.5px solid var(--edge); }
    .chip.won { background: var(--pitch); color: var(--onpitch); }
    .chip.lost { background: var(--red); color: var(--onred); }

    /* Graf */
    .chart { width: 100%; height: auto; background: var(--surface); border: 1.5px solid var(--edge); border-radius: 12px; display: block; }
    .chart polyline { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .chart .c1 { stroke: var(--t1); } .chart .cx { stroke: var(--muted); stroke-dasharray: 4 4; } .chart .c2 { stroke: var(--t2); }
    .chart .half { stroke: var(--line); stroke-dasharray: 3 3; }

    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--head); color: var(--headink); border-top: 3px solid var(--edge); padding: 6px 8px; }
    nav .in { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
    nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: inherit; text-decoration: none; border: 2px solid transparent;
      border-radius: 12px; padding: 5px 4px 4px; font-weight: 800; font-size: 12px;
      line-height: 1; opacity: .72;
    }
    nav a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    nav a[aria-current="page"] { background: var(--tabon); color: var(--tabonink); border-color: var(--edge); opacity: 1; }

    .toast {
      position: fixed; left: 50%; bottom: calc(var(--navh) + 12px);
      transform: translate(-50%, 12px); opacity: 0; visibility: hidden;
      background: var(--fill); color: var(--fillink); border: 3px solid var(--filledge);
      box-shadow: 4px 4px 0 var(--edge); padding: 10px 16px; border-radius: 12px;
      font-weight: 800; z-index: 50; transition: .25s ease; text-align: center;
    }
    .toast.show { transform: translate(-50%, 0) rotate(-1deg); opacity: 1; visibility: visible; }
  </style>
</head>

<script>
const SUPABASE_URL = 'https://jvnbhbnpxdyufmctmarg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2bmJoYm5weGR5dWZtY3RtYXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NzEzOTgsImV4cCI6MjExMDM0NzM5OH0.XYHYQCt6RHl8fQjYEJniU1z3hzfSBVVz39UlnxZqlsc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const f2 = x => Number(x).toFixed(2).replace('.', ',');
const fmt = n => Math.round(n).toLocaleString('da-DK');
const LBL = ['1', 'X', '2'];

const LIVE_GAMES = [
  { h: 'OB', a: 'Randers FC', lg: 'Superliga', lh: 1.45, la: 1.15, clubShare1X2: [48, 22, 30], clubShareNext: [52, 18, 30] },
  { h: 'FC København', a: 'Brøndby IF', lg: 'Superliga', lh: 1.65, la: 1.10, clubShare1X2: [58, 19, 23], clubShareNext: [61, 14, 25] },
  { h: 'Liverpool', a: 'Arsenal', lg: 'Premier League', lh: 1.55, la: 1.35, clubShare1X2: [44, 26, 30], clubShareNext: [47, 20, 33] }
];

let currentUser = null;
let myProfile = { id: '', display_name: 'Dig', pp: 1000, pralepengeskab: 0, badges: [] };
let gameIdx = 0;
let lv = null;
let lvTimer = null;
let lvSpeed = 1;
let selectedMarket = null; // '1x2' | 'next_goal'
let selectedIndex = null;  // 0, 1, 2
let lvStake = 100;

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2800);
}

function pois(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }

function lvProbs() {
  const r = Math.max(0, (90 - lv.t) / 90), a = lv.lh * r, b = lv.la * r;
  let H = 0, D = 0, A = 0;
  for (let x = 0; x <= 10; x++) {
    const px = pois(x, a);
    for (let y = 0; y <= 10; y++) {
      const p = px * pois(y, b), d = (lv.gh + x) - (lv.ga + y);
      if (d > 0) H += p; else if (d === 0) D += p; else A += p;
    }
  }
  const s = H + D + A;
  return [H / s, D / s, A / s];
}

function nextGoalProbs() {
  const r = Math.max(0.02, (90 - lv.t) / 90);
  const remH = lv.lh * r;
  const remA = lv.la * r;
  const pNoMore = Math.exp(-(remH + remA));
  const pScore = 1 - pNoMore;
  const pH = pScore * (remH / (remH + remA));
  const pA = pScore * (remA / (remH + remA));
  return [pH, pNoMore, pA];
}

const toOdds = p => +Math.min(50, Math.max(1.05, 1 / Math.max(p, 0.001))).toFixed(2);

function initLiveMatch() {
  const g = LIVE_GAMES[gameIdx % LIVE_GAMES.length];
  lv = {
    h: g.h, a: g.a, lg: g.lg, lh: g.lh, la: g.la,
    clubShare1X2: g.clubShare1X2,
    clubShareNext: g.clubShareNext,
    t: 0, gh: 0, ga: 0,
    running: false, done: false,
    lockUntil: 0,
    megaBanner: null, // { title, sub }
    hist: [],
    timeline: [],
    myCalls: []
  };
  lv.hist.push(lvProbs());
}

function triggerMegaDisplay(title, sub, minute) {
  lv.megaBanner = { title, sub, minute };
  setTimeout(() => {
    if (lv.megaBanner && lv.megaBanner.minute === minute) {
      lv.megaBanner = null;
      renderAll();
    }
  }, 3500);
}

function lvTick() {
  lv.t++;

  // Ved 1. minut: KAMPSTART
  if (lv.t === 1) {
    lv.timeline.unshift({ min: 1, ic: '🏁', title: 'KAMPSTART', desc: `${lv.h} – ${lv.a} er fløjtet i gang`, score: '0 – 0' });
    triggerMegaDisplay('KAMPSTART · 1\'', `${lv.h} mod ${lv.a}`, 1);
  }

  // Ved 45. minut: PAUSE
  if (lv.t === 45) {
    lv.timeline.unshift({ min: 45, ic: '⏸️', title: 'PAUSE', desc: `Stilling ved pausen: ${lv.gh} – ${lv.ga}`, score: `${lv.gh} – ${lv.ga}` });
  }

  // Mål eller Rødt kort
  if (Math.random() < lv.lh / 90) {
    lv.gh++;
    lv.lockUntil = lv.t + 3; // 20 sekunders lås simuleret
    const sc = `${lv.gh} – ${lv.ga}`;
    lv.timeline.unshift({ min: lv.t, ic: '⚽', title: `MÅL! ${lv.h}`, desc: `Scoring i ${lv.t}. minut!`, score: sc });
    triggerMegaDisplay(`⚽ MÅL! (${lv.t}')`, `${lv.h} scorer til ${sc}!`, lv.t);
    settleNextGoalCalls(0);
  } else if (Math.random() < lv.la / 90) {
    lv.ga++;
    lv.lockUntil = lv.t + 3;
    const sc = `${lv.gh} – ${lv.ga}`;
    lv.timeline.unshift({ min: lv.t, ic: '⚽', title: `MÅL! ${lv.a}`, desc: `Scoring i ${lv.t}. minut!`, score: sc });
    triggerMegaDisplay(`⚽ MÅL! (${lv.t}')`, `${lv.a} scorer til ${sc}!`, lv.t);
    settleNextGoalCalls(2);
  } else if (Math.random() < 0.004) {
    const isHome = Math.random() < 0.5;
    if (isHome) lv.lh *= 0.7; else lv.la *= 0.7;
    lv.lockUntil = lv.t + 3;
    const team = isHome ? lv.h : lv.a;
    lv.timeline.unshift({ min: lv.t, ic: '🟥', title: `RØDT KORT (${lv.t}')`, desc: `Udvisning til ${team}`, score: `${lv.gh} – ${lv.ga}` });
    triggerMegaDisplay(`🟥 RØDT KORT (${lv.t}')`, `Udvisning til ${team}!`, lv.t);
  }

  lv.hist.push(lvProbs());

  if (lv.t >= 90) {
    finishLiveMatch();
    return;
  }
  renderAll();
}

function settleNextGoalCalls(scorerIdx) {
  let wonSum = 0;
  lv.myCalls.forEach(c => {
    if (c.market === 'next_goal' && c.status === 'pending') {
      if (c.choice === scorerIdx) {
        c.status = 'won';
        c.payout = Math.round(c.stake * c.odds);
        wonSum += c.payout;
      } else {
        c.status = 'lost';
      }
    }
  });
  if (wonSum > 0) {
    myProfile.pp += wonSum;
    $('#fp').textContent = fmt(myProfile.pp);
    sb.from('profiles').update({ pp: myProfile.pp }).eq('id', currentUser.id);
    toast(`Ramte plet på Næste mål! +${fmt(wonSum)} PP ⚽`);
  }
}

async function finishLiveMatch() {
  clearInterval(lvTimer);
  lvTimer = null;
  lv.running = false;
  lv.done = true;

  const finalRes = lv.gh > lv.ga ? 0 : lv.gh === lv.ga ? 1 : 2;
  const sc = `${lv.gh} – ${lv.ga}`;
  lv.timeline.unshift({ min: 90, ic: '🔚', title: 'SLUTFLØJT (90\')', desc: `Kampen slutter ${sc}`, score: sc });
  triggerMegaDisplay(`SLUTFLØJT · 90'`, `Slutresultat: ${lv.h} ${sc} ${lv.a}`, 90);

  // Afregn resterende Næste mål (1 = Ingen flere mål) og 1X2-kald
  let totalWon = 0;
  const newBadges = new Set(Array.isArray(myProfile.badges) ? myProfile.badges : []);

  lv.myCalls.forEach(c => {
    if (c.status === 'pending') {
      const hit = (c.market === '1x2' && c.choice === finalRes) || (c.market === 'next_goal' && c.choice === 1);
      c.status = hit ? 'won' : 'lost';
      if (hit) {
        c.payout = Math.round(c.stake * c.odds);
        totalWon += c.payout;
        if (c.stake >= 100 && c.placedMin > 75) newBadges.add('late');
      }
    }
  });

  if (totalWon > 0) {
    myProfile.pp += totalWon;
    $('#fp').textContent = fmt(myProfile.pp);
    await sb.from('profiles').update({ pp: myProfile.pp, badges: [...newBadges] }).eq('id', currentUser.id);
    toast(`Slutfløjt! Dine live-kald gav +${fmt(totalWon)} PP 🏆`);
  }
  renderAll();
}

function renderAll() {
  renderLiveCard();
  renderTimeline();
  renderMyLiveCalls();
  renderChart();
}

function renderLiveCard() {
  const p1x2 = lvProbs();
  const o1x2 = p1x2.map(toOdds);
  const pNext = nextGoalProbs();
  const oNext = pNext.map(toOdds);

  // Live-kald er åbne til og med 84. minut og låses i 20 sek efter mål/rødt kort
  const isLocked = lv.running && (lv.t < lv.lockUntil || lv.t > 84);
  const lockReason = lv.t > 84 ? '🔒 Live-kald er lukket efter 84. minut' : '🔒 Odds låst i 20 sek. efter hændelse på banen';

  const clock = lv.done ? 'SLUT · 90\'' : lv.t === 45 && lv.running ? 'PAUSE · 45\'' : `${lv.t}'`;
  const nextLabels = [`${lv.h} scorer`, 'Ingen flere mål', `${lv.a} scorer`];

  // Beregn aktuel kupon-knap
  let currentOdds = 1;
  let selectionTitle = 'Klik på et odds herover for at lægge et live-kald';
  if (selectedMarket === '1x2' && selectedIndex !== null) {
    currentOdds = o1x2[selectedIndex];
    selectionTitle = `Kald: ${selectedIndex === 0 ? lv.h + ' vinder' : selectedIndex === 2 ? lv.a + ' vinder' : 'Uafgjort'} (Odds ${f2(currentOdds)})`;
  } else if (selectedMarket === 'next_goal' && selectedIndex !== null) {
    currentOdds = oNext[selectedIndex];
    selectionTitle = `Næste mål: ${nextLabels[selectedIndex]} (Odds ${f2(currentOdds)})`;
  }

  $('#liveMatchBox').innerHTML = `
    <div class="lvtop">
      <span class="blive${lv.running ? ' on' : ''}">${lv.running ? 'LIVE · ' + lv.lg : lv.done ? 'SLUTFLØJT' : 'KLAR TIL KAMPSTART'}</span>
      <span class="num clock">${clock}</span>
    </div>

    ${lv.megaBanner ? `
      <div class="event-mega" role="alert">
        <span class="ev-title">${lv.megaBanner.title}</span>
        <span class="ev-sub">${lv.megaBanner.sub}</span>
      </div>
    ` : ''}

    <div class="score">
      <span>${lv.h}</span>
      <b class="num">${lv.gh} – ${lv.ga}</b>
      <span>${lv.a}</span>
    </div>

    ${isLocked ? `<div class="lockbar">${lockReason}</div>` : ''}

    <!-- MARKED 1: KAMPENS UDFALD (1X2) + KLUBBENS VALG % -->
    <div class="market-label">
      <span>Kampens udfald (1X2)</span>
      <span>Klubbens valg</span>
    </div>
    <div class="odds">
      ${[0, 1, 2].map(i => {
        const on = selectedMarket === '1x2' && selectedIndex === i;
        return `<button type="button" class="odd${on ? ' on' : ''}" data-mkt="1x2" data-idx="${i}" ${(!lv.running || isLocked) ? 'disabled' : ''}>
          <span class="ol">${LBL[i]}</span>
          <span class="ov">${f2(o1x2[i])}</span>
          <span class="cs">${lv.clubShare1X2[i]} % i klubben</span>
        </button>`;
      }).join('')}
    </div>

    <!-- MARKED 2: NÆSTE MÅL -->
    <div class="market-label">
      <span>Næste mål i kampen</span>
      <span>Åben til 84'</span>
    </div>
    <div class="odds">
      ${[0, 1, 2].map(i => {
        const on = selectedMarket === 'next_goal' && selectedIndex === i;
        return `<button type="button" class="odd${on ? ' on' : ''}" data-mkt="next_goal" data-idx="${i}" ${(!lv.running || isLocked) ? 'disabled' : ''}>
          <span class="ol">${nextLabels[i]}</span>
          <span class="ov">${f2(oNext[i])}</span>
          <span class="cs">${lv.clubShareNext[i]} % i klubben</span>
        </button>`;
      }).join('')}
    </div>

    <!-- INLINE LIVE-KUPON DIREKTE UNDER KAMPEN -->
    <div class="inline-slip">
      ${!lv.running && !lv.done ? `
        <button type="button" class="cta" id="startLiveBtn">🏁 Fløjt kampen i gang (Start Live)</button>
      ` : lv.done ? `
        <button type="button" class="cta" id="nextLiveGameBtn">⏭️ Gå til næste live-kamp</button>
      ` : `
        <div class="inline-slip-head">
          <span>${selectionTitle}</span>
        </div>
        <div class="stakes">
          ${[50, 100, 200, 300].map(s => `<button type="button" data-lvstake="${s}" aria-pressed="${s === lvStake}">${s} PP</button>`).join('')}
        </div>
        <button type="button" class="cta" id="placeLiveCallBtn" ${(selectedIndex === null || isLocked) ? 'disabled' : ''}>
          ${selectedIndex === null ? 'Vælg et udfald herover' : `Afgiv live-kald (${lv.t}') · Mulig gevinst ${fmt(lvStake * currentOdds)} PP`}
        </button>
      `}

      <div class="speed-bar">
        <span>Kamp-tempo:</span>
        <div>
          ${[1, 3, 6].map(sp => `<button type="button" data-speed="${sp}" aria-pressed="${lvSpeed === sp}">${sp}×</button>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderTimeline() {
  if (!lv.timeline.length) {
    $('#flashTimeline').innerHTML = `<div class="fs-row"><span class="fs-min">0'</span><span class="fs-icon">⏱️</span><span>Afventer kampstart...</span><span>0 – 0</span></div>`;
    return;
  }
  $('#flashTimeline').innerHTML = lv.timeline.map(e => `
    <div class="fs-row">
      <span class="fs-min">${e.min}'</span>
      <span class="fs-icon">${e.ic}</span>
      <div>
        <div>${e.title}</div>
        <small style="color:var(--muted);font-weight:600">${e.desc}</small>
      </div>
      <span class="fs-badge num">${e.score}</span>
    </div>
  `).join('');
}

function renderMyLiveCalls() {
  const box = $('#myLiveCallsBox');
  if (!lv.myCalls.length) {
    box.innerHTML = `<p style="color:var(--muted);font-size:14px;margin:0">Du har ingen kald i denne live-kamp endnu.</p>`;
    return;
  }
  const curRes = lv.gh > lv.ga ? 0 : lv.gh === lv.ga ? 1 : 2;
  box.innerHTML = lv.myCalls.map(c => {
    const standingHit = c.market === '1x2' ? (c.choice === curRes) : (c.choice === 1);
    const statusText = c.status === 'won'
      ? `Ramte plet +${fmt(c.payout)} PP`
      : c.status === 'lost'
        ? 'Forbi'
        : standingHit ? 'Står til at ramme plet ✓' : 'Bagud lige nu';
    return `<div class="my-live-card">
      <div>
        <b>${c.label} <small style="color:var(--muted)">(${c.placedMin}')</small></b>
        <small style="display:block;color:var(--muted)">Indsats: ${c.stake} PP · Odds ${f2(c.odds)}</small>
      </div>
      <span class="chip ${c.status === 'won' || (c.status === 'pending' && standingHit) ? 'won' : c.status === 'lost' ? 'lost' : ''}">${statusText}</span>
    </div>`;
  }).join('');
}

function renderChart() {
  const W = 300, H = 90;
  const line = k => lv.hist.map((p, j) => (j / 90 * W).toFixed(1) + ',' + (4 + (1 - p[k]) * (H - 8)).toFixed(1)).join(' ');
  $('#liveChartBox').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Chancen gennem kampen">
      <line x1="${W / 2}" y1="0" x2="${W / 2}" y2="${H}" class="half"/>
      <polyline points="${line(1)}" class="cx"/>
      <polyline points="${line(2)}" class="c2"/>
      <polyline points="${line(0)}" class="c1"/>
    </svg>
  `;
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.id === 'startLiveBtn') {
    lv.running = true;
    lvTimer = setInterval(lvTick, 1000 / lvSpeed);
    renderAll();
    return;
  }

  if (btn.id === 'nextLiveGameBtn') {
    gameIdx++;
    selectedMarket = null;
    selectedIndex = null;
    initLiveMatch();
    renderAll();
    return;
  }

  if (btn.dataset.speed) {
    lvSpeed = +btn.dataset.speed;
    if (lvTimer) {
      clearInterval(lvTimer);
      lvTimer = setInterval(lvTick, 1000 / lvSpeed);
    }
    renderAll();
    return;
  }

  if (btn.dataset.mkt) {
    const mkt = btn.dataset.mkt;
    const idx = +btn.dataset.idx;
    if (selectedMarket === mkt && selectedIndex === idx) {
      selectedMarket = null;
      selectedIndex = null;
    } else {
      selectedMarket = mkt;
      selectedIndex = idx;
    }
    renderLiveCard();
    return;
  }

  if (btn.dataset.lvstake) {
    lvStake = +btn.dataset.lvstake;
    renderLiveCard();
    return;
  }

  if (btn.id === 'placeLiveCallBtn') {
    if (myProfile.pp < lvStake) {
      toast('Du har ikke nok PP!');
      return;
    }
    const oddsArr = selectedMarket === '1x2' ? lvProbs().map(toOdds) : nextGoalProbs().map(toOdds);
    const odds = oddsArr[selectedIndex];
    const nextLabels = [`${lv.h} scorer næste`, 'Ingen flere mål', `${lv.a} scorer næste`];
    const label = selectedMarket === '1x2'
      ? (selectedIndex === 0 ? `${lv.h} vinder` : selectedIndex === 2 ? `${lv.a} vinder` : 'Uafgjort')
      : nextLabels[selectedIndex];

    myProfile.pp -= lvStake;
    $('#fp').textContent = fmt(myProfile.pp);

    lv.myCalls.unshift({
      market: selectedMarket,
      choice: selectedIndex,
      label,
      odds,
      stake: lvStake,
      placedMin: lv.t,
      status: 'pending',
      payout: 0
    });

    const newBadges = new Set(Array.isArray(myProfile.badges) ? myProfile.badges : []);
    if (lvStake >= 100) newBadges.add('live');

    await sb.from('profiles').update({ pp: myProfile.pp, badges: [...newBadges] }).eq('id', currentUser.id);

    selectedMarket = null;
    selectedIndex = null;
    toast(`Live-kald sat (${lv.t}'): ${label} til odds ${f2(odds)} 📡`);
    renderAll();
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) {
    window.location.replace('login.html');
    return;
  }
  currentUser = session.user;
  $('#appBody').hidden = false;

  const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (prof) {
    myProfile = prof;
    $('#fp').textContent = fmt(prof.pp);
  }
  initLiveMatch();
  renderAll();
})();
</script>
</body>
</html>
