<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pral — Spillerunden & Globalt Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #F4F4F1; --surface: #FFFFFF; --ink: #111318; --muted: #5B5F6B; --line: #D9DAD5; --edge: #111318;
      --pitch: #111318; --onpitch: #FFFFFF; --card: #FF5A4E; --oncard: #111318; --red: #E0312B; --onred: #FFFFFF; --soft: #EFEFEA;
      --head: #111318; --headink: #FFFFFF; --tab: #24272F; --tabink: #FFFFFF; --tabedge: #3A3E48; --tabon: #FF5A4E; --tabonink: #111318;
      --wallet: #FF5A4E; --walletink: #111318; --hover: #FFE3DF; --fill: #FF5A4E; --fillink: #111318; --filledge: #111318;
      --hbg: #111318; --hink: #FFFFFF;
      --disp: "Archivo Black", "Archivo", system-ui, sans-serif;
      --body: "Archivo", system-ui, -apple-system, Segoe UI, sans-serif;
      --navh: 66px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1014; --surface: #191B21; --ink: #F3F3EF; --muted: #A3A6B0; --line: #2B2E37; --edge: #8E929C;
        --pitch: #FF6A5E; --onpitch: #111318; --card: #FF6A5E; --oncard: #111318; --red: #FF5A54; --onred: #111318; --soft: #22252D;
        --head: #15171C; --headink: #FFFFFF; --tab: #22252D; --tabink: #F3F3EF; --tabedge: #3A3E48; --tabon: #FF6A5E; --tabonink: #111318;
        --wallet: #FF6A5E; --walletink: #111318; --hover: #3A2523; --fill: #FF6A5E; --fillink: #111318; --filledge: #FF6A5E;
        --hbg: #22252D; --hink: #F3F3EF;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg);
      background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
      background-size: 18px 18px; color: var(--ink);
      font: 500 16px/1.45 var(--body); -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .num { font-family: "Archivo", system-ui, sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; }

    /* Header med PP-saldo + Min side lige ved siden af */
    header { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--headink); border-bottom: 3px solid var(--edge); }
    .bar { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font: 400 32px/.95 var(--disp); letter-spacing: -.02em; text-decoration: none; color: inherit; }
    .brand .dot { display: inline-block; width: .26em; height: .26em; border-radius: 50%; background: var(--card); margin-left: .07em; }
    .brand small { display: block; font: 700 12px/1.3 var(--body); opacity: .75; margin-top: 3px; }
    .walletwrap { display: flex; gap: 8px; align-items: center; }
    .wallet {
      display: flex; align-items: baseline; gap: 4px;
      background: var(--wallet); color: var(--walletink);
      border-radius: 8px; padding: 6px 11px; transform: rotate(-2deg);
      box-shadow: 3px 3px 0 var(--edge); text-decoration: none;
    }
    .wallet .num { font-size: 20px; line-height: 1; }
    .wallet span:last-child { font-size: 11.5px; font-weight: 800; }
    .minside-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--tab); color: var(--tabink);
      border: 2px solid var(--tabedge); border-radius: 8px;
      padding: 6px 10px; font: 800 12.5px/1 var(--body);
      text-decoration: none; box-shadow: 2px 2px 0 var(--edge);
    }
    .minside-btn:hover { border-color: var(--card); }

    main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--navh) + 250px); }

    /* Runde-banner */
    .round-banner {
      background: var(--surface); border: 2.5px solid var(--edge); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 14px; box-shadow: 4px 4px 0 var(--edge);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .round-banner b { font: 400 18px/1.1 var(--disp); display: block; }
    .round-banner small { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .live-pill {
      background: var(--red); color: var(--onred); border: 2px solid var(--edge);
      border-radius: 8px; padding: 6px 10px; font: 800 12px/1 var(--body);
      text-decoration: none; white-space: nowrap; box-shadow: 2px 2px 0 var(--edge);
    }

    /* Liga-filtre */
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      flex: none; border: 2px solid var(--edge); background: var(--surface);
      border-radius: 99px; padding: 6px 14px; font-weight: 800; font-size: 13px;
      cursor: pointer; box-shadow: 2px 2px 0 var(--edge);
    }
    .filters button[aria-pressed="true"] { background: var(--card); color: var(--oncard); transform: translate(2px, 2px); box-shadow: none; }

    /* Kampkort */
    .match { background: var(--surface); border: 1.5px solid var(--edge); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .mhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .mhead .live-tag { background: var(--red); color: var(--onred); padding: 2px 7px; border-radius: 5px; font-size: 11px; }
    .teams { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 0 12px; font: 400 19px/1.15 var(--disp); flex-wrap: wrap; }
    .teams .vs { font: 700 13px/1 var(--body); color: var(--muted); margin: 0 4px; }
    .teams .live-score { background: var(--ink); color: var(--card); padding: 2px 8px; border-radius: 6px; font-size: 16px; }
    .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .odd {
      background: var(--soft); border: 2px solid var(--edge); border-radius: 10px;
      padding: 8px 6px 6px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; line-height: 1.05; box-shadow: 3px 3px 0 var(--edge);
      transition: transform .1s, box-shadow .1s;
    }
    .odd .ol { font-size: 12px; font-weight: 800; color: var(--muted); }
    .odd .ov { font: 900 26px/1.1 "Archivo", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .odd .cs { font-size: 11px; font-weight: 600; color: var(--muted); min-height: 14px; margin-top: 2px; }
    .odd.on { background: var(--pitch); color: var(--onpitch); transform: translate(3px, 3px); box-shadow: none; }
    .odd.on .ol, .odd.on .cs { color: var(--onpitch); opacity: .85; }
    .odd.res { background: var(--card); color: var(--oncard); }

    /* Globale Leaderboards (Pralepengeskab & Klubber) */
    h3 {
      font: 400 21px/1.1 var(--disp); margin: 28px 0 10px;
      display: inline-block; background: var(--hbg); color: var(--hink);
      border: 1.5px solid var(--edge); padding: 4px 10px; border-radius: 6px;
      transform: rotate(-1deg);
    }
    .lb-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .lb-switch button {
      border: 2px solid var(--edge); background: var(--surface); border-radius: 10px;
      padding: 8px; font: 400 14px/1 var(--disp); cursor: pointer; box-shadow: 2px 2px 0 var(--edge);
    }
    .lb-switch button[aria-pressed="true"] { background: var(--card); color: var(--oncard); transform: translate(2px, 2px); box-shadow: none; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1.5px solid var(--edge); border-radius: 12px; overflow: hidden; }
    td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; font-size: 14.5px; }
    tr:first-child td { border-top: 0; }
    td.r { text-align: right; }
    tr.me { background: var(--fill); color: var(--fillink); font-weight: 800; }
    .av {
      flex: none; display: inline-grid; place-items: center;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--c); color: var(--ct); border: 2px solid var(--edge);
      font: 900 13px/1 "Archivo", system-ui, sans-serif; margin-right: 8px;
    }

    /* Kuponslip i bunden */
    .slip {
      position: fixed; left: 0; right: 0; bottom: var(--navh); z-index: 6;
      background: var(--surface); border-top: 3px solid var(--edge);
      padding: 12px 16px 14px; transform: translateY(110%); transition: transform .25s ease;
    }
    .slip.show { transform: none; }
    .slip .in { max-width: 560px; margin: 0 auto; }
    .slip h2 { margin: 0; font: 400 20px/1 var(--disp); display: flex; justify-content: space-between; align-items: baseline; }
    .slip h2 .num { background: var(--card); color: var(--oncard); padding: 3px 8px; border-radius: 6px; font-size: 17px; font-weight: 900; }
    .slip ul { list-style: none; margin: 8px 0; padding: 0; font-size: 13.5px; max-height: 80px; overflow: auto; }
    .slip li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
    .comment-in { width: 100%; border: 2px solid var(--edge); background: var(--soft); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; margin-top: 4px; }
    .stakes { display: flex; gap: 8px; margin: 8px 0 10px; }
    .stakes button { flex: 1; border: 2px solid var(--edge); background: var(--surface); border-radius: 8px; padding: 6px 0; cursor: pointer; font-weight: 800; box-shadow: 2px 2px 0 var(--edge); font-size: 13.5px; }
    .stakes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; transform: translate(2px, 2px); }
    .cta { width: 100%; border: 3px solid var(--edge); border-radius: 12px; padding: 11px; background: var(--pitch); color: var(--onpitch); font: 400 17px/1.1 var(--disp); cursor: pointer; box-shadow: 4px 4px 0 var(--edge); }
    .clr { margin-left: 8px; border: 1.5px solid var(--edge); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 3px 8px; font: 800 11.5px/1 var(--body); cursor: pointer; }

    /* Bundnavigation (De 4 kernefaner) */
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--head); color: var(--headink); border-top: 3px solid var(--edge); padding: 6px 8px; }
    nav .in { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
    nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: inherit; text-decoration: none; border: 2px solid transparent;
      border-radius: 12px; padding: 5px 4px 4px; font-weight: 800; font-size: 12px;
      line-height: 1; opacity: .72;
    }
    nav a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    nav a[aria-current="page"] { background: var(--tabon); color: var(--tabonink); border-color: var(--edge); opacity: 1; }

    .toast {
      position: fixed; left: 50%; bottom: calc(var(--navh) + 12px);
      transform: translate(-50%, 12px); opacity: 0; visibility: hidden;
      background: var(--fill); color: var(--fillink); border: 3px solid var(--filledge);
      box-shadow: 4px 4px 0 var(--edge); padding: 10px 16px; border-radius: 12px;
      font-weight: 800; z-index: 50; transition: .25s ease; text-align: center;
    }
    .toast.show { transform: translate(-50%, 0) rotate(-1deg); opacity: 1; visibility: visible; }
  </style>
</head>
<body id="appBody" hidden>

<header>
  <div class="bar">
    <a href="index.html" class="brand">
      Pral<span class="dot" aria-hidden="true"></span>
      <small id="roundSubLabel">Superliga · Runde 17</small>
    </a>
    <div class="walletwrap">
      <a href="min-side.html" class="wallet" title="Din runde-saldo">
        <span class="num" id="fp">1.000</span><span>PP</span>
      </a>
      <a href="min-side.html" class="minside-btn" title="Gå til Min side & Pralepengeskab">
        👤 Min side
      </a>
    </div>
  </div>
</header>

<main>
  <!-- Spillerunde-overblik med live-indikator -->
  <div class="round-banner">
    <div>
      <b id="roundBannerTitle">Runde 17 · Superliga + Ekstra</b>
      <small id="roundBannerSub">1.000 PP pr. runde · Dine kald tæller i alle dine klubber</small>
    </div>
    <a href="live.html" class="live-pill" id="liveJumpPill">📡 1 LIVE NU &rarr;</a>
  </div>

  <!-- Liga-filtre -->
  <div class="filters" id="leagueFilters"></div>

  <!-- Kampkort -->
  <section id="matchesList"></section>

  <!-- Globalt Leaderboard: Alle Spillere (Pralepengeskab) & Klub Leaderboard -->
  <h3>Globalt Pralepengeskab</h3>
  <div class="lb-switch" role="tablist">
    <button type="button" id="lbPlayersBtn" aria-pressed="true">🏦 Alle Spillere</button>
    <button type="button" id="lbClubsBtn" aria-pressed="false">🛡️ Klub Leaderboard</button>
  </div>
  <div id="globalLeaderboardBox"></div>
</main>

<!-- Kuponslip (50, 100, 200, 300 PP + Sæt resten, maks 5 kampe, maks odds 50) -->
<div class="slip" id="slip" aria-live="polite"><div class="in" id="slipIn"></div></div>

<nav aria-label="Faner">
  <div class="in">
    <a href="index.html" aria-current="page">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4.3 3.1-1.6 5h-5.4l-1.6-5z"/></svg>
      Kampe
    </a>
    <a href="live.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      Live
    </a>
    <a href="klub.html">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.4 1.7 5 4.4"/></svg>
      Klubben
    </a>
    <a href="badges.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.8L7 22l5-2.8 5 2.8-1.5-8.2"/></svg>
      Badges
    </a>
  </div>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://jvnbhbnpxdyufmctmarg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2bmJoYm5weGR5dWZtY3RtYXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NzEzOTgsImV4cCI6MjExMDM0NzM5OH0.XYHYQCt6RHl8fQjYEJniU1z3hzfSBVVz39UlnxZqlsc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const f2 = x => Number(x).toFixed(2).replace('.', ',');
const fmt = n => Math.round(n).toLocaleString('da-DK');
const LBL = ['1', 'X', '2'];

const DEFAULT_MATCHES = [
  { id: 'm1', round: 17, lg: 'Superliga', h: 'FC København', a: 'Brøndby IF', t: 'Søn 14.00', o: [1.85, 3.70, 4.10], status: 'upcoming', gh: 0, ga: 0 },
  { id: 'm2', round: 17, lg: 'Superliga', h: 'OB', a: 'Randers FC', t: 'LIVE · 62\'', o: [2.10, 3.25, 3.60], status: 'live', gh: 1, ga: 1 },
  { id: 'm3', round: 17, lg: 'Superliga', h: 'FC Midtjylland', a: 'AGF', t: 'Søn 18.00', o: [1.62, 4.00, 5.20], status: 'upcoming', gh: 0, ga: 0 },
  { id: 'm4', round: 17, lg: 'Superliga', h: 'Silkeborg IF', a: 'Viborg FF', t: 'Fre 19.00', o: [2.05, 3.45, 3.40], status: 'upcoming', gh: 0, ga: 0 },
  { id: 'm5', round: 17, lg: 'Premier League', h: 'Liverpool', a: 'Arsenal', t: 'Søn 17.30', o: [2.30, 3.50, 2.95], status: 'upcoming', gh: 0, ga: 0 },
  { id: 'm6', round: 17, lg: 'La Liga', h: 'Real Madrid', a: 'Barcelona', t: 'Lør 21.00', o: [2.10, 3.80, 3.20], status: 'upcoming', gh: 0, ga: 0 }
];

let currentUser = null;
let myProfile = { id: '', display_name: 'Dig', pp: 1000, pralepengeskab: 0, badges: [] };
let matches = [...DEFAULT_MATCHES];
let allCalls = [];
let allProfiles = [];
let allClubs = [];
let allClubMembers = [];
let selectedLeague = 'Alle';
let lbMode = 'players'; // 'players' | 'clubs'
let slip = {};
let stake = 100;
let slipComment = '';
let currentRound = 17;

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2800);
}

const mById = id => matches.find(m => m.id === id) || DEFAULT_MATCHES[0];
const pickText = (m, i) => i === 0 ? m.h + ' vinder' : i === 2 ? m.a + ' vinder' : 'Uafgjort';

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) {
    window.location.replace('login.html');
    return;
  }
  currentUser = session.user;
  $('#appBody').hidden = false;

  await loadRoundAndGlobalData();
}

async function loadRoundAndGlobalData() {
  // 1. Hent egen profil
  const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (prof) {
    myProfile = prof;
    $('#fp').textContent = fmt(prof.pp);
  }

  // 2. Hent kampe fra databasen
  const { data: dbMatches } = await sb.from('matches').select('*').order('id');
  if (dbMatches && dbMatches.length > 0) {
    matches = dbMatches.map(m => ({
      id: m.id,
      round: m.round || 17,
      lg: m.league,
      h: m.home_team,
      a: m.away_team,
      t: m.kickoff_label,
      o: Array.isArray(m.odds) ? m.odds : [2.0, 3.4, 3.2],
      status: m.status || 'upcoming',
      gh: m.home_goals || 0,
      ga: m.away_goals || 0,
      result: m.result
    }));
    currentRound = matches[0].round || 17;
  }

  // 3. Hent rundens kald (så procent-valg på hvert udfald tæller både enkelt- og kombikald)
  const { data: callsData } = await sb.from('calls').select('picks').eq('round', currentRound);
  allCalls = callsData || [];

  // 4. Hent alle profiler og klubber til Globalt Leaderboard
  const { data: profs } = await sb.from('profiles').select('id, display_name, pp, pralepengeskab');
  allProfiles = profs || [];

  const { data: clubsData } = await sb.from('clubs').select('id, name, invite_code');
  allClubs = clubsData || [];

  const { data: cmData } = await sb.from('club_members').select('club_id, user_id');
  allClubMembers = cmData || [];

  const liveCount = matches.filter(m => m.status === 'live').length;
  $('#roundSubLabel').textContent = `Superliga · Runde ${currentRound}`;
  $('#roundBannerTitle').textContent = `Runde ${currentRound} · Superliga + Ekstra`;
  $('#liveJumpPill').textContent = liveCount ? `📡 ${liveCount} LIVE NU →` : `📡 Gå til Live →`;

  renderFilters();
  renderMatches();
  renderSlip();
  renderGlobalLeaderboard();
}

function share(mid, i) {
  const relevant = allCalls.filter(k => Array.isArray(k.picks) && k.picks.some(p => p.m === mid));
  if (!relevant.length) return null;
  const count = relevant.filter(k => k.picks.some(p => p.m === mid && p.i === i)).length;
  return count / relevant.length;
}

function renderFilters() {
  const leagues = ['Alle', ...new Set(matches.map(m => m.lg))];
  $('#leagueFilters').innerHTML = leagues
    .map(lg => `<button type="button" data-lg="${lg}" aria-pressed="${lg === selectedLeague}">${lg}</button>`)
    .join('');
}

function renderMatches() {
  const list = selectedLeague === 'Alle' ? matches : matches.filter(m => m.lg === selectedLeague);
  $('#matchesList').innerHTML = list.map(m => {
    const isLive = m.status === 'live';
    const isFinished = m.result !== null && m.result !== undefined;
    return `<article class="match">
      <div class="mhead">
        <span>${m.lg}</span>
        ${isLive ? `<a href="live.html" class="live-tag" style="text-decoration:none">📡 ${m.t} · Åbn Live</a>` : `<span>${m.t}</span>`}
      </div>
      <div class="teams">
        <div><span>${m.h}</span><span class="vs">mod</span><span>${m.a}</span></div>
        ${isLive ? `<span class="live-score num">${m.gh} – ${m.ga}</span>` : ''}
      </div>
      <div class="odds">
        ${m.o.map((o, i) => {
          const s = share(m.id, i);
          const on = slip[m.id] === i;
          const res = isFinished && m.result === i;
          return `<button type="button" class="odd${on ? ' on' : ''}${res ? ' res' : ''}" data-m="${m.id}" data-i="${i}" aria-pressed="${on}" ${isFinished ? 'disabled' : ''}>
            <span class="ol">${LBL[i]}${res ? ' · plet' : ''}</span>
            <span class="ov">${f2(o)}</span>
            <span class="cs">${s === null ? '0 % valgte' : Math.round(s * 100) + ' % valgte'}</span>
          </button>`;
        }).join('')}
      </div>
    </article>`;
  }).join('');
}

function renderSlip() {
  const ids = Object.keys(slip);
  $('#slip').classList.toggle('show', ids.length > 0);
  if (!ids.length) return;

  // Kombikald-regel: Maks. odds 50,00
  const rawOdds = ids.reduce((a, id) => a * mById(id).o[slip[id]], 1);
  const cappedOdds = Math.min(50, rawOdds);

  // Indsats-regel: 50, 100, 200, 300 PP (eller Sæt resten hvis saldo er mellem 10 og 49 PP)
  const balance = myProfile.pp ?? 1000;
  let stakeButtonsHTML = '';
  if (balance < 50 && balance >= 10) {
    stake = balance;
    stakeButtonsHTML = `<button type="button" data-stake="${balance}" aria-pressed="true">Sæt resten (${balance} PP)</button>`;
  } else {
    if (![50, 100, 200, 300].includes(stake)) stake = 100;
    stakeButtonsHTML = [50, 100, 200, 300]
      .map(s => `<button type="button" data-stake="${s}" aria-pressed="${s === stake}">${s} PP</button>`)
      .join('');
  }

  $('#slipIn').innerHTML = `
    <h2>
      <span>${ids.length === 1 ? 'Enkeltkald' : `Kombikald (${ids.length}/5 kampe)`}<button type="button" class="clr" id="clearSlipBtn">Ryd</button></span>
      <span class="num">Odds ${f2(cappedOdds)}${rawOdds > 50 ? ' (Maks 50)' : ''}</span>
    </h2>
    <ul>
      ${ids.map(id => {
        const m = mById(id);
        return `<li><span>${pickText(m, slip[id])}</span><span class="num">${f2(m.o[slip[id]])}</span></li>`;
      }).join('')}
    </ul>
    <input type="text" class="comment-in" id="slipCommentInput" placeholder="Skriv en kæk kommentar til klubbens opslagstavle..." value="${slipComment.replace(/"/g, '&quot;')}">
    <div class="stakes" role="group" aria-label="Vælg indsats">${stakeButtonsHTML}</div>
    <button type="button" class="cta" id="placeCallBtn">Afgiv kald · Mulig gevinst ${fmt(stake * cappedOdds)} PP</button>
  `;
  $('#slipCommentInput')?.addEventListener('input', e => { slipComment = e.target.value; });
}

function renderGlobalLeaderboard() {
  const box = $('#globalLeaderboardBox');
  const medals = ['🥇', '🥈', '🥉'];

  if (lbMode === 'players') {
    const sorted = [...allProfiles].sort((a, b) => ((b.pralepengeskab || 0) + (b.pp || 0)) - ((a.pralepengeskab || 0) + (a.pp || 0)));
    box.innerHTML = `<table>
      ${sorted.slice(0, 15).map((p, i) => {
        const vault = (p.pralepengeskab || 0) + (p.pp || 0);
        return `<tr class="${p.id === currentUser.id ? 'me' : ''}">
          <td style="width:36px;font-weight:900">${medals[i] || (i + 1) + '.'}</td>
          <td><b>${p.display_name || 'Spiller'}</b></td>
          <td class="r"><span class="num">${fmt(vault)}</span> PP</td>
        </tr>`;
      }).join('') || '<tr><td>Ingen spillere endnu.</td></tr>'}
    </table>`;
  } else {
    const clubTotals = allClubs.map(c => {
      const memIds = allClubMembers.filter(m => m.club_id === c.id).map(m => m.user_id);
      const totalVault = allProfiles
        .filter(p => memIds.includes(p.id))
        .reduce((sum, p) => sum + (p.pralepengeskab || 0) + (p.pp || 0), 0);
      return { ...c, memberCount: memIds.length, totalVault };
    }).sort((a, b) => b.totalVault - a.totalVault);

    box.innerHTML = `<table>
      ${clubTotals.map((c, i) => `
        <tr>
          <td style="width:36px;font-weight:900">${medals[i] || (i + 1) + '.'}</td>
          <td><b>${c.name}</b> <small style="color:var(--muted)">(${c.memberCount} medl.)</small></td>
          <td class="r"><span class="num">${fmt(c.totalVault)}</span> PP</td>
        </tr>
      `).join('') || '<tr><td>Ingen klubber oprettet endnu.</td></tr>'}
    </table>`;
  }
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.lg) {
    selectedLeague = btn.dataset.lg;
    renderFilters();
    renderMatches();
    return;
  }

  if (btn.id === 'lbPlayersBtn') {
    lbMode = 'players';
    $('#lbPlayersBtn').setAttribute('aria-pressed', 'true');
    $('#lbClubsBtn').setAttribute('aria-pressed', 'false');
    renderGlobalLeaderboard();
    return;
  }
  if (btn.id === 'lbClubsBtn') {
    lbMode = 'clubs';
    $('#lbClubsBtn').setAttribute('aria-pressed', 'true');
    $('#lbPlayersBtn').setAttribute('aria-pressed', 'false');
    renderGlobalLeaderboard();
    return;
  }

  // Vælg udfald (Maks 5 kampe i et kombikald)
  if (btn.dataset.m) {
    const m = btn.dataset.m, i = +btn.dataset.i;
    if (slip[m] === i) {
      delete slip[m];
    } else {
      if (!slip.hasOwnProperty(m) && Object.keys(slip).length >= 5) {
        toast('Et kombikald kan højst indeholde 5 kampe!');
        return;
      }
      slip[m] = i;
    }
    renderMatches();
    renderSlip();
    return;
  }

  if (btn.dataset.stake) {
    stake = +btn.dataset.stake;
    renderSlip();
    return;
  }

  if (btn.id === 'clearSlipBtn') {
    slip = {};
    slipComment = '';
    renderMatches();
    renderSlip();
    return;
  }

  if (btn.id === 'placeCallBtn') {
    if (myProfile.pp < stake || myProfile.pp < 10) {
      toast('Du har ikke nok PP i denne runde!');
      return;
    }
    const picks = Object.keys(slip).map(m => ({ m, i: slip[m] }));
    const rawOdds = picks.reduce((a, p) => a * mById(p.m).o[p.i], 1);
    const odds = +Math.min(50, rawOdds).toFixed(2);
    const activeClubId = localStorage.getItem('pral_active_club_id') || null;

    myProfile.pp -= stake;
    $('#fp').textContent = fmt(myProfile.pp);

    const newBadges = new Set(Array.isArray(myProfile.badges) ? myProfile.badges : []);
    if (stake >= 100) newBadges.add('first');

    try {
      await sb.from('calls').insert({
        club_id: activeClubId,
        user_id: currentUser.id,
        round: currentRound,
        picks,
        stake,
        odds,
        comment: slipComment.trim(),
        status: 'pending'
      });
      await sb.from('profiles').update({
        pp: myProfile.pp,
        total_calls: (myProfile.total_calls || 0) + 1,
        badges: [...newBadges]
      }).eq('id', currentUser.id);
    } catch (err) {
      console.warn('Fejl ved gem:', err.message);
    }

    slip = {};
    slipComment = '';
    await loadRoundAndGlobalData();
    toast('Kald afgivet! Det tæller nu i alle dine klubber ⚽');
  }
});

boot();
</script>
</body>
</html>
