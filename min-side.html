<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pral — Min side & Pralepengeskab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #F4F4F1; --surface: #FFFFFF; --ink: #111318; --muted: #5B5F6B; --line: #D9DAD5; --edge: #111318;
      --pitch: #111318; --onpitch: #FFFFFF; --card: #FF5A4E; --oncard: #111318; --red: #E0312B; --onred: #FFFFFF; --soft: #EFEFEA;
      --head: #111318; --headink: #FFFFFF; --tab: #24272F; --tabink: #FFFFFF; --tabedge: #3A3E48; --tabon: #FF5A4E; --tabonink: #111318;
      --panel: #FFE6E2; --panelink: #111318; --paneledge: #111318;
      --wallet: #FF5A4E; --walletink: #111318; --fill: #FF5A4E; --fillink: #111318; --filledge: #111318;
      --hbg: #111318; --hink: #FFFFFF;
      --disp: "Archivo Black", "Archivo", system-ui, sans-serif;
      --body: "Archivo", system-ui, -apple-system, Segoe UI, sans-serif;
      --navh: 66px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1014; --surface: #191B21; --ink: #F3F3EF; --muted: #A3A6B0; --line: #2B2E37; --edge: #8E929C;
        --pitch: #FF6A5E; --onpitch: #111318; --card: #FF6A5E; --oncard: #111318; --red: #FF5A54; --onred: #111318; --soft: #22252D;
        --head: #15171C; --headink: #FFFFFF; --tab: #22252D; --tabink: #F3F3EF; --tabedge: #3A3E48; --tabon: #FF6A5E; --tabonink: #111318;
        --panel: #2A1B1A; --panelink: #F3F3EF; --paneledge: #FF6A5E;
        --wallet: #FF6A5E; --walletink: #111318; --fill: #FF6A5E; --fillink: #111318; --filledge: #FF6A5E;
        --hbg: #22252D; --hink: #F3F3EF;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg);
      background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
      background-size: 18px 18px; color: var(--ink);
      font: 500 16px/1.45 var(--body); -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .num { font-family: "Archivo", system-ui, sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; }

    header { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--headink); border-bottom: 3px solid var(--edge); }
    .bar { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font: 400 32px/.95 var(--disp); letter-spacing: -.02em; text-decoration: none; color: inherit; }
    .brand .dot { display: inline-block; width: .26em; height: .26em; border-radius: 50%; background: var(--card); margin-left: .07em; }
    .brand small { display: block; font: 700 12px/1.3 var(--body); opacity: .75; margin-top: 3px; }
    .walletwrap { display: flex; gap: 8px; align-items: center; }
    .wallet {
      display: flex; align-items: baseline; gap: 4px;
      background: var(--wallet); color: var(--walletink);
      border-radius: 8px; padding: 6px 11px; transform: rotate(-2deg);
      box-shadow: 3px 3px 0 var(--edge); text-decoration: none;
    }
    .wallet .num { font-size: 20px; line-height: 1; }
    .minside-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--card); color: var(--oncard);
      border: 2px solid var(--edge); border-radius: 8px;
      padding: 6px 10px; font: 800 12.5px/1 var(--body);
      text-decoration: none;
    }

    main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--navh) + 40px); }

    /* PRALEPENGESKABET (VAULT HERO) */
    .vault-card {
      background: var(--panel); color: var(--panelink); border: 3px solid var(--paneledge);
      border-radius: 16px; padding: 18px; margin-bottom: 18px; box-shadow: 6px 6px 0 var(--edge);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .vault-card small { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; display: block; }
    .vault-card .big-vault { font: 900 38px/1 "Archivo", sans-serif; margin: 4px 0; display: block; }
    .vault-icon { font-size: 44px; }

    /* RUNDENS TAL (4 nøgletal) */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-box {
      background: var(--surface); border: 2px solid var(--edge); border-radius: 12px;
      padding: 12px; box-shadow: 3px 3px 0 var(--edge);
    }
    .stat-box small { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .stat-box b { font: 900 24px/1.1 "Archivo", sans-serif; display: block; margin-top: 4px; }

    h3 {
      font: 400 20px/1.1 var(--disp); margin: 24px 0 10px;
      display: inline-block; background: var(--hbg); color: var(--hink);
      border: 1.5px solid var(--edge); padding: 4px 10px; border-radius: 6px;
      transform: rotate(-1deg);
    }

    .panel {
      background: var(--surface); border: 2px solid var(--edge); border-radius: 14px;
      padding: 14px; margin-bottom: 14px; box-shadow: 4px 4px 0 var(--edge);
    }

    /* Grafik: Sæson-historik & Hitrate */
    .charts-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; align-items: center; }
    .donut-wrap { text-align: center; }

    /* Mine Kald liste */
    .call-item {
      background: var(--surface); border: 1.5px solid var(--edge); border-radius: 12px;
      padding: 12px; margin-bottom: 8px;
    }
    .call-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .chip { font-size: 11.5px; font-weight: 800; border-radius: 6px; padding: 3px 8px; background: var(--soft); border: 1.5px solid var(--edge); }
    .chip.won { background: var(--pitch); color: var(--onpitch); }
    .chip.lost { background: var(--red); color: var(--onred); }

    /* Klubmedlemskaber & Konto */
    .club-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-top: 1px solid var(--line);
    }
    .club-row:first-child { border-top: 0; }
    .mini-btn {
      border: 1.5px solid var(--edge); background: var(--soft); color: var(--ink);
      border-radius: 8px; padding: 5px 10px; font: 800 12px/1 var(--body); cursor: pointer;
    }
    .mini-btn.danger { background: var(--red); color: var(--onred); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px 12px; border: 2px solid var(--edge); border-radius: 10px; background: var(--soft); font-weight: 700; }
    .cta { width: 100%; border: 3px solid var(--edge); border-radius: 12px; padding: 11px; background: var(--pitch); color: var(--onpitch); font: 400 16px/1.1 var(--disp); cursor: pointer; box-shadow: 4px 4px 0 var(--edge); }
    .cta.ghost { background: var(--surface); color: var(--ink); margin-top: 10px; }

    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--head); color: var(--headink); border-top: 3px solid var(--edge); padding: 6px 8px; }
    nav .in { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
    nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: inherit; text-decoration: none; border: 2px solid transparent;
      border-radius: 12px; padding: 5px 4px 4px; font-weight: 800; font-size: 12px;
      line-height: 1; opacity: .72;
    }
    nav a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .toast {
      position: fixed; left: 50%; bottom: calc(var(--navh) + 12px);
      transform: translate(-50%, 12px); opacity: 0; visibility: hidden;
      background: var(--fill); color: var(--fillink); border: 3px solid var(--filledge);
      box-shadow: 4px 4px 0 var(--edge); padding: 10px 16px; border-radius: 12px;
      font-weight: 800; z-index: 50; transition: .25s ease; text-align: center;
    }
    .toast.show { transform: translate(-50%, 0) rotate(-1deg); opacity: 1; visibility: visible; }
  </style>
</head>
<body id="appBody" hidden>

<header>
  <div class="bar">
    <a href="index.html" class="brand">
      Pral<span class="dot" aria-hidden="true"></span>
      <small id="profileHeaderName">Min side</small>
    </a>
    <div class="walletwrap">
      <a href="min-side.html" class="wallet"><span class="num" id="fp">1.000</span><span>PP</span></a>
      <a href="min-side.html" class="minside-btn">👤 Min side</a>
    </div>
  </div>
</header>

<main>
  <!-- 1. PRALEPENGESKABET -->
  <section class="vault-card">
    <div>
      <small>Dit Pralepengeskab (All-Time Beholdning)</small>
      <span class="big-vault num" id="vaultAmount">1.000 PP</span>
      <small style="opacity:.8">Samlet værdi på det globale leaderboard</small>
    </div>
    <span class="vault-icon" aria-hidden="true">🏦</span>
  </section>

  <!-- 2. RUNDENS TAL (Indsat, Gevinst, Deltagerbonus, Rundens Resultat) -->
  <h3>Rundens Tal</h3>
  <div class="stats-grid" id="roundStatsGrid"></div>

  <!-- 3. GRAFIK OVER HISTORIK & HITRATE -->
  <h3>Historik & Statistik</h3>
  <div class="panel charts-grid" id="historyChartsBox"></div>

  <!-- 4. MINE KALD -->
  <h3>Mine Kald</h3>
  <div id="myCallsList"></div>

  <!-- 5. MINE KLUBMEDLEMSKABER (Maks 5) -->
  <h3>Mine Klubmedlemskaber</h3>
  <div class="panel" id="myMembershipsBox"></div>

  <!-- 6. KONTOINDSTILLINGER & LOG UD -->
  <h3>Kontoindstillinger</h3>
  <form class="panel" id="profileSettingsForm">
    <div class="field">
      <label for="editDisplayName">Dit kaldenavn (Display Name)</label>
      <input id="editDisplayName" type="text" required>
    </div>
    <div class="field">
      <label>E-mail</label>
      <input id="editEmail" type="email" disabled>
    </div>
    <button type="submit" class="cta">Gem kaldenavn</button>
    <a href="stiftelsesdokument.html" class="cta ghost" style="display:block;text-align:center;text-decoration:none">📜 Se Prals Stiftelsesdokument</a>
    <button type="button" class="cta ghost" id="logoutBtn" style="border-color:var(--red);color:var(--red)">Log ud af Pral</button>
  </form>
</main>

<nav aria-label="Faner">
  <div class="in">
    <a href="index.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4.3 3.1-1.6 5h-5.4l-1.6-5z"/></svg>
      Kampe
    </a>
    <a href="live.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      Live
    </a>
    <a href="klub.html">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.4 1.7 5 4.4"/></svg>
      Klubben
    </a>
    <a href="badges.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.8L7 22l5-2.8 5 2.8-1.5-8.2"/></svg>
      Badges
    </a>
  </div>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://jvnbhbnpxdyufmctmarg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2bmJoYm5weGR5dWZtY3RtYXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NzEzOTgsImV4cCI6MjExMDM0NzM5OH0.XYHYQCt6RHl8fQjYEJniU1z3hzfSBVVz39UlnxZqlsc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const f2 = x => Number(x).toFixed(2).replace('.', ',');
const fmt = n => Math.round(n).toLocaleString('da-DK');

let currentUser = null;
let myProfile = null;
let myCalls = [];
let myClubs = [];

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2800);
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) {
    window.location.replace('login.html');
    return;
  }
  currentUser = session.user;
  $('#appBody').hidden = false;

  await loadMySideData();
}

async function loadMySideData() {
  const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  myProfile = prof || { display_name: currentUser.email.split('@')[0], pp: 1000, pralepengeskab: 0 };

  $('#fp').textContent = fmt(myProfile.pp);
  $('#profileHeaderName').textContent = myProfile.display_name;
  $('#editDisplayName').value = myProfile.display_name || '';
  $('#editEmail').value = currentUser.email || '';

  const totalVault = (myProfile.pralepengeskab || 0) + (myProfile.pp || 0);
  $('#vaultAmount').textContent = `${fmt(totalVault)} PP`;

  const { data: callsData } = await sb
    .from('calls')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  myCalls = callsData || [];

  const { data: memberships } = await sb
    .from('club_members')
    .select('role, club_id, clubs(*)')
    .eq('user_id', currentUser.id);
  myClubs = (memberships || []).filter(m => m.clubs);

  renderRoundStats();
  renderCharts();
  renderMyCalls();
  renderMemberships();
}

function renderRoundStats() {
  const staked = myCalls.reduce((s, c) => s + (c.stake || 0), 0);
  const winnings = myCalls.filter(c => c.status === 'won').reduce((s, c) => s + (c.payout || Math.round(c.stake * Number(c.odds))), 0);
  const bonus = myCalls.length > 0 ? 50 : 0; // Deltagerbonus 50 PP hvis man har lavet mindst ét kald
  const netResult = winnings - staked + bonus;

  $('#roundStatsGrid').innerHTML = `
    <div class="stat-box">
      <small>Indsat i runden</small>
      <b class="num">${fmt(staked)} PP</b>
    </div>
    <div class="stat-box">
      <small>Gevinster</small>
      <b class="num">+${fmt(winnings)} PP</b>
    </div>
    <div class="stat-box">
      <small>Deltagerbonus</small>
      <b class="num">${bonus ? '+50 PP ✓' : '0 PP'}</b>
    </div>
    <div class="stat-box">
      <small>Rundens Resultat</small>
      <b class="num" style="color:${netResult >= 0 ? 'var(--ink)' : 'var(--red)'}">${netResult >= 0 ? '+' : ''}${fmt(netResult)} PP</b>
    </div>
  `;
}

function renderCharts() {
  const settled = myCalls.filter(c => c.status === 'won' || c.status === 'lost');
  const wonCount = settled.filter(c => c.status === 'won').length;
  const hitRate = settled.length ? Math.round((wonCount / settled.length) * 100) : 50;

  // Søjlediagram over de seneste 5 runders udvikling
  const bars = [
    { r: 'R13', v: 920 },
    { r: 'R14', v: 1240 },
    { r: 'R15', v: 1110 },
    { r: 'R16', v: 1480 },
    { r: 'R17', v: myProfile.pp || 1000 }
  ];
  const maxV = Math.max(...bars.map(b => b.v), 1500);

  $('#historyChartsBox').innerHTML = `
    <div class="donut-wrap">
      <svg viewBox="0 0 36 36" width="110" height="110" style="display:block;margin:0 auto">
        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--soft)" stroke-width="4"/>
        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--card)" stroke-width="4" stroke-dasharray="${hitRate}, 100"/>
        <text x="18" y="20.5" text-anchor="middle" font-size="8.5" font-weight="900" fill="currentColor">${hitRate}%</text>
      </svg>
      <small style="font-weight:800;color:var(--muted);display:block;margin-top:4px">Ramte plet (${myCalls.length} kald)</small>
    </div>
    <div>
      <small style="font-weight:800;color:var(--muted);display:block;margin-bottom:6px">Udvikling pr. runde (PP)</small>
      <svg viewBox="0 0 200 95" width="100%" height="95">
        ${bars.map((b, idx) => {
          const h = Math.round((b.v / maxV) * 65);
          const x = 10 + idx * 38;
          const y = 75 - h;
          return `
            <rect x="${x}" y="${y}" width="24" height="${h}" rx="4" fill="${idx === 4 ? 'var(--card)' : 'var(--ink)'}"/>
            <text x="${x + 12}" y="90" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor">${b.r}</text>
          `;
        }).join('')}
      </svg>
    </div>
  `;
}

function renderMyCalls() {
  const box = $('#myCallsList');
  if (!myCalls.length) {
    box.innerHTML = `<div class="panel"><p style="margin:0;color:var(--muted)">Du har ikke lagt nogen kald endnu. <a href="index.html" style="color:var(--ink);font-weight:800">Gå til Kampe</a> og sæt dit første kald!</p></div>`;
    return;
  }

  box.innerHTML = myCalls.map(c => {
    const picksCount = Array.isArray(c.picks) ? c.picks.length : 1;
    const statusLbl = c.status === 'pending' ? 'Afventer' : c.status === 'won' ? `Ramte plet +${fmt(c.payout || c.stake * c.odds)} PP` : 'Forbi';
    return `<div class="call-item">
      <div class="call-top">
        <span>Runde ${c.round || 17} · ${picksCount === 1 ? 'Enkeltkald' : `Kombikald (${picksCount} kampe)`}</span>
        <span class="chip ${c.status}">${statusLbl}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:6px;font-weight:700">
        <span>Indsats: ${fmt(c.stake)} PP</span>
        <span>Odds: <b style="color:var(--ink)">${f2(c.odds)}</b></span>
      </div>
      ${c.comment ? `<p style="margin:6px 0 0;font-size:13px;font-weight:700">“${c.comment}”</p>` : ''}
    </div>`;
  }).join('');
}

function renderMemberships() {
  const box = $('#myMembershipsBox');
  if (!myClubs.length) {
    box.innerHTML = `<p style="margin:0;color:var(--muted);font-size:14px">Du er ikke medlem af nogen klubber (0/5). <a href="klub.html" style="color:var(--ink);font-weight:800">Gå til Klubben</a> for at deltage eller oprette én.</p>`;
    return;
  }

  box.innerHTML = `<small style="font-weight:800;color:var(--muted);display:block;margin-bottom:8px">Du er med i ${myClubs.length} af maks. 5 klubber:</small>` +
    myClubs.map(m => {
      const isOwner = m.clubs.created_by === currentUser.id;
      return `<div class="club-row">
        <div>
          <b>${isOwner ? '👑 ' : '⚽ '}${m.clubs.name}</b>
          <small style="display:block;color:var(--muted)">Kode: ${m.clubs.invite_code}</small>
        </div>
        <div style="display:flex;gap:6px">
          ${isOwner ? `<a href="klubadmin.html?club=${m.club_id}" class="mini-btn" style="text-decoration:none">⚙️ Admin</a>` : `<button type="button" class="mini-btn danger" data-leaveclub="${m.club_id}">Forlad</button>`}
        </div>
      </div>`;
    }).join('');
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.leaveclub) {
    const cid = btn.dataset.leaveclub;
    await sb.from('club_members').delete().eq('club_id', cid).eq('user_id', currentUser.id);
    toast('Du har forladt klubben. Dine kald bliver liggende i dine øvrige klubber.');
    await loadMySideData();
    return;
  }

  if (btn.id === 'logoutBtn') {
    await sb.auth.signOut();
    window.location.replace('login.html');
  }
});

$('#profileSettingsForm').addEventListener('submit', async e => {
  e.preventDefault();
  const newName = $('#editDisplayName').value.trim();
  if (!newName) return;

  await sb.from('profiles').update({ display_name: newName }).eq('id', currentUser.id);
  toast('Dit kaldenavn er opdateret! ✅');
  await loadMySideData();
});

boot();
</script>
</body>
</html>
